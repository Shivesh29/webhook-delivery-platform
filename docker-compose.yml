services:
  postgres:
    image: postgres:16-alpine
    container_name: webhook-postgres
    restart: always
    environment:
      POSTGRES_DB: webhook_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webhook_platform"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Uncomment to run the entire backend inside Docker container:
  # app:
  #   build: .
  #   container_name: webhook-app
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webhook_platform
  #     SPRING_DATASOURCE_USERNAME: postgres
  #     SPRING_DATASOURCE_PASSWORD: password
  #   ports:
  #     - "8080:8080"

volumes:
  postgres_data:
