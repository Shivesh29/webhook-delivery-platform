server:
  port: ${PORT:8085}

spring:
  application:
    name: webhook-delivery-platform
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

webhook:
  security:
    # Default admin API key for authenticating incoming requests
    api-key: "${WEBHOOK_API_KEY:wh_live_adminkey_2026_secret}"
    allow-loopback: ${WEBHOOK_ALLOW_LOOPBACK:true}
  delivery:
    max-attempts: ${WEBHOOK_MAX_ATTEMPTS:5}
    connect-timeout-ms: ${WEBHOOK_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${WEBHOOK_READ_TIMEOUT_MS:5000}
    # Base backoff delays in seconds for retry attempts (attempt 1: immediate, attempt 2: +60s, attempt 3: +300s, attempt 4: +1800s, attempt 5: +7200s)
    backoff-multipliers-seconds:
      - 60
      - 300
      - 1800
      - 7200
  worker:
    polling-interval-ms: ${WEBHOOK_WORKER_POLL_MS:5000}
    batch-size: ${WEBHOOK_WORKER_BATCH_SIZE:50}

