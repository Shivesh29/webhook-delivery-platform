spring:
  datasource:
    url: jdbc:h2:mem:webhook_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

webhook:
  security:
    api-key: "test_api_key_123"
  delivery:
    max-attempts: 3
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
    backoff-multipliers-seconds:
      - 2
      - 5
  worker:
    polling-interval-ms: 1000
    batch-size: 10

